<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                font-family: "Segoe UI", sans-serif;
                color: white;
                background-color: rgba(0, 0, 0, 0.5);
                margin: 20px;
                display: flex;
                align-items: center;
                gap: 20px;
            }
            .cover { width: 120px; height: 120px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
            .info { display: flex; flex-direction: column; gap: 5px; }
            .track { font-weight: bold; font-size: 24px; }
            .artist { color: #F5F5F5; font-size: 18px; }
            .lyrics { margin-top: 10px; }
            .current-lyric { font-size: 20px; font-weight: bold; color: #1DB954; transition: all 0.2s ease; }
            .other-lyric { font-size: 16px; color: #a7a7a7; opacity: 0.7; }
            .album { font-weight: lighter; font-size: 16px; }
        </style>
    </head>
    <body>
        <img id="cover" class="cover" src="" alt="">
        <div class="info">
            <div id="track" class="track">Waiting for Spotify...</div>
            <div id="artist" class="artist"></div>
            <div class="lyrics">
                <div id="pl" class="other-lyric"></div>
                <div id="cl" class="current-lyric"></div>
                <div id="nl" class="other-lyric"></div>
            </div>
        </div>

        <script>
            async function loadConfig() {
                try {
                    const response = await fetch("/config");
                    if (!response.ok) throw new Error("Failed to read config file: Server error");
                    
                    const config = await response.json();
                    return config;
                } catch (error) {
                    console.error("Failed to read config file:", error);
                    return null;
                }
            }

            async function init() {
                const config = await loadConfig();
                
                if (!config) {
                    console.error("Initialization aborted: Config could not be loaded.");
                    return;
                }

                // Connect to the Python WebSocket server
                const ws = new WebSocket(`ws://${window.location.host}/ws`);

                ws.onopen = () => {
                    ws.send(JSON.stringify({ type: "registerListener" }));
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (config.showSongTitle) document.getElementById("track").innerText = data.t;
                    if (config.showArtist) document.getElementById("artist").innerText = data.ar;
                    if (config.showAlbumName) {
                        document.getElementById("artist").innerHTML += ` <span class="album">| ${data.al}</span>`
                    }
                    if (config.showCurrentLyric) document.getElementById("cl").innerText = data.cl;
                    if (config.showPreviousLyric) document.getElementById("pl").innerText = data.pl;
                    if (config.showNextLyric) document.getElementById("nl").innerText = data.nl;
                    
                    if (config.showAlbumArt) {
                        const img = document.getElementById("cover");
                        if (img.src !== data.ac) img.src = data.ac;
                    } else {
                        document.getElementById("cover").style.visibility = "hidden";
                    }
                };

                ws.onclose = () => {
                    console.log("WebSocket disconnected. Retrying in 2 seconds...");
                    setTimeout(() => { location.reload(); }, 2000);
                };
            }

            // Kick off the application
            init();
        </script>
    </body>
</html>
